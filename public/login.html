<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso - Plataforma de Aprobaciones</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--bg);
    }

    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      padding: 40px;
      width: 100%;
      max-width: 380px;
    }

    .login-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: center;
      margin-bottom: 28px;
      color: var(--primary);
    }

    .login-logo span {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
    }

    .login-card h2 {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      text-align: center;
      margin-bottom: 6px;
    }

    .login-card p {
      font-size: 14px;
      color: var(--text-secondary);
      text-align: center;
      margin-bottom: 28px;
    }

    .error-box {
      background: var(--danger-light);
      border: 1px solid #fecaca;
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 13px;
      color: var(--danger);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .login-footer {
      margin-top: 20px;
      text-align: center;
    }

    .login-footer a {
      font-size: 13px;
      color: var(--text-muted);
      text-decoration: none;
    }

    .login-footer a:hover {
      color: var(--primary);
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 11l3 3L22 4"/>
        <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
      </svg>
      <span>Aprobaciones</span>
    </div>

    <h2>Bienvenido</h2>
    <p>Ingresá tus credenciales para continuar</p>

    <div id="error-box" class="error-box" style="display:none">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      Usuario o contraseña incorrectos
    </div>

    <form method="POST" action="/login">
      <div class="form-group">
        <label class="form-label">Usuario</label>
        <input class="form-input" type="text" name="username" autocomplete="username" autofocus>
      </div>
      <div class="form-group">
        <label class="form-label">Contraseña</label>
        <input class="form-input" type="password" name="password" autocomplete="current-password">
      </div>
      <button type="submit" class="btn-submit" style="margin-top:8px">Ingresar</button>
    </form>
  </div>

  <script>
    if (new URLSearchParams(location.search).get('error')) {
      document.getElementById('error-box').style.display = 'flex';
    }
  </script>
</body>
</html>
